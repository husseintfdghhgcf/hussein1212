<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول المشرف - لوحة تحكم إدارة وتقييم الطلاب</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/tailwind-config.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Arabic Font: Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Custom styles -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200">
    <div class="min-h-screen flex flex-col">
        <div class="absolute top-4 left-4"><button id="themeToggleBtn" type="button" onclick="toggleDarkMode()" class="p-2.5 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl transition-all" title="تبديل الوضع"><i id="themeIcon" class="fa-solid fa-moon text-lg"></i></button></div>
        <main class="flex-grow flex items-center justify-center p-4">
            <div class="w-full max-w-md">
                <div class="flex justify-center mb-6"><div class="flex items-center space-x-3 space-x-reverse">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-blue-500/30"><i class="fa-solid fa-graduation-cap text-xl"></i></div>
                        <div><h1 class="font-bold text-lg leading-tight text-gray-900 dark:text-white">منصة النخبة التعليمية</h1><p class="text-xs text-gray-500 dark:text-gray-400">تسجيل دخول المشرف</p></div>
                    </div></div>
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-100 dark:border-gray-700 overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/40">
                        <h2 class="font-bold text-gray-900 dark:text-white text-base flex items-center gap-2">
                            <i class="fa-solid fa-user-shield text-blue-500"></i> دخول المشرف
                        </h2>
                    </div>
                    <form id="loginForm" autocomplete="off" class="p-6 space-y-4" data-endpoint="/api/admin/login" data-field="username" data-redirect="index.html">
                        <div id="loginError" class="hidden px-3.5 py-2.5 rounded-xl bg-rose-50 dark:bg-rose-900/30 text-rose-600 dark:text-rose-300 text-xs font-semibold border border-rose-200 dark:border-rose-800/40">
                            <i class="fa-solid fa-circle-exclamation"></i> <span id="loginErrorText"></span>
                        </div>
                        <div>
                            <label for="loginName" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">اسم المستخدم</label>
                            <input type="text" id="loginName" name="username" required maxlength="120" placeholder="اسم المستخدم"
                                   class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label for="loginPassword" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">كلمة المرور</label>
                            <input type="password" id="loginPassword" name="password" required maxlength="128" autocomplete="current-password"
                                   class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <button type="submit" id="loginSubmit" class="w-full px-5 py-2.5 rounded-xl text-sm font-semibold bg-blue-600 hover:bg-blue-700 text-white shadow-md shadow-blue-600/20 transition-all hover:scale-[1.02] active:scale-95">
                            <i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول
                        </button>
                    </form>
                </div>
                <p class="text-center mt-4">
                    <a href="../student/login.html" class="text-xs text-blue-600 dark:text-blue-400 font-bold hover:underline">هل أنت طالب؟ الدخول من بوابة الطلاب</a>
                </p>
            </div>
        </main>
        <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 py-4 mt-auto">
            <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500 dark:text-gray-400">لوحة تحكم تقييم وإدارة الطلاب &copy; 2026 - جميع الحقوق محفوظة</div>
        </footer>
    </div>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/login.js"></script>
</body>
</html>
